<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio Card Responsivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-6 md:max-w-2xl">
      <div class="flex flex-col items-center gap-6 md:flex md:flex-row md:items-start">
        <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-slate-900 text-lg font-semibold text-white">
          <img
    src="foto.jpg"
    alt="Foto de Kauã Dal Santo"
    class="h-16 w-16 rounded-full object-cover"
/>
        </div>

        <div class="flex-1 text-center md:text-left">
          <span class="text-sm font-medium uppercase tracking-[0.2em] text-slate-500">
            Desenvolvedor Front-end
          </span>
          <h1 class="mt-2 text-2xl font-semibold text-slate-900">Kauã Dal Santo</h1>
          <p class="mt-4 text-slate-600 leading-relaxed">
            "O segredo de uma interface incrível não está nas cores, mas no domínio absoluto do
            espaçamento e da hierarquia visual."
          </p>
          <button class="mt-6 inline-flex items-center justify-center rounded-lg border border-slate-600 hover:border-slate-800 px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-200 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-white">
           <a href="https://github.com/DAlS1N" target="_blank"> Ver Perfil</a>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
