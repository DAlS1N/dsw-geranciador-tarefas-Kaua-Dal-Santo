<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Gerenciador de Tarefas</title>
</head>
<body>

    <header class="bg-slate-400 text-blue-950 text-2xl font-bold">
        <h1 >Gerenciador de Tarefas</h1>
    </header>

    <main>

        <!-- Seção do formulário de cadastro -->
        <section>
            <h2>Criar Nova Tarefa</h2>

            <form id="form-tarefa">

                <div>
                    <label for="input-titulo">Título:</label>
                    <input
                        type="text"
                        id="input-titulo"
                        name="titulo"
                        placeholder="Digite o título da tarefa"
                        required
                    >
                </div>

                <div>
                    <label for="select-prioridade">Prioridade:</label>
                    <select id="select-prioridade" name="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                    </select>
                </div>

                <button type="submit">Adicionar Tarefa</button>

            </form>
        </section>

        <!-- Seção da lista de tarefas (protótipo estático) -->
        <section>
            <h2>Minhas Tarefas</h2>

            <div>
                <input type="checkbox" id="tarefa1">
                <label for="tarefa1">
                    <strong>Estudar para prova de Web</strong>
                </label>
            </div>
        </section>

    </main>

    <footer>
        <p>Desenvolvido em 2026</p>
    </footer>

</body>
</html>
