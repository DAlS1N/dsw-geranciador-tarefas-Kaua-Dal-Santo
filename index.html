<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
    </header>

    <main>
        <!-- Seção do formulário de cadastro-->
         <section>
            <h2>Criar Nova Tarefa</h2>
            <form>
                <div>
                    <label for="input-titulo">Título:</label>
                    <input type="text" id="input-titulo" name="titulo" required placeholder="Digite o título da tarefa">
                </div>
                <div>
                    <label for="select-prioridade">Prioridade:</label>
                    <select id="select-prioridade" name="prioridade" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                </div>
                <button type="submit">Adicionar Tarefa</button>
            </form>
         </section>

        <!-- Seção da lista de tarefas  (prototipo estático)-->
            <h2>Minhas Tarefas</h2>
        <section>
                <div> 
                    <input type="checkbox">
                    <h4>Estudar para prova de Web</h4>
                </div>
        </section>

    </main>

    <footer>
        <p>Desenvolvido por kauã</p>
    </footer>


</body>
</html>
